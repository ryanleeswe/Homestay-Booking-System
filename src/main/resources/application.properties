spring.application.name=Homestay-Booking-System

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homestay_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:classpath:application-local.properties

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl-seconds=900
security.jwt.refresh-token-ttl-seconds=604800
